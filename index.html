<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>星圖守城</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08101f;color:#eef5ff;font-family:system-ui,-apple-system,sans-serif}header{padding:14px;max-width:1000px;margin:auto}h1{margin:0;color:#ffd36b}.sub{font-size:12px;color:#9aabc6}main{max-width:1000px;margin:auto;padding:8px;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:10px}.arena,.card{background:#101d31;border:1px solid #29405f;border-radius:14px;overflow:hidden}.arena{position:relative}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:8px}.stat{text-align:center;background:#172842;border-radius:8px;padding:6px}.stat small{display:block;color:#9aabc6;font-size:11px}.stat strong{font-size:18px}canvas{display:block;width:100%;height:auto;touch-action:manipulation}.side{display:flex;flex-direction:column;gap:9px}.card{padding:12px}.card h2{margin:0 0 8px;color:#ffd36b;font-size:15px}.tower,button{cursor:pointer;border-radius:9px;padding:10px;border:1px solid #345071;background:#172943;color:#eef5ff}.tower{width:100%;text-align:left;display:flex;gap:8px;align-items:center;margin:6px 0}.tower.active{border-color:#6be6ff;background:#1c3550}.build-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.build-actions button{margin:0}.build-actions .confirm{background:#6be6ff;color:#071326;font-weight:bold;border:0}.build-actions .cancel{background:#26364c}.tower small{display:block;color:#9aabc6;font-size:11px}.ico{font-size:21px}.btn{width:100%;margin-top:6px;background:#ffd36b;color:#162033;font-weight:bold;border:0}.hint{font-size:12px;color:#9aabc6;line-height:1.6}.message{font-size:12px;color:#6be6ff;min-height:28px;margin-top:7px}.overlay{display:none;position:absolute;inset:0;background:#06101ddd;align-items:center;justify-content:center;text-align:center;padding:18px}.overlay.show{display:flex}.modal{background:#142640;border:1px solid #4b668a;border-radius:14px;padding:20px;max-width:320px}.modal h2{color:#ffd36b}@media(max-width:700px){main{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.side .card:first-child{grid-column:1/-1}.card{padding:9px}.stat strong{font-size:16px}}
</style></head><body><header><h1>✦ 星圖守城</h1><div class="sub">STARFALL DEFENSE · 守住星門，迎接黎明</div></header><main><section class="arena"><div class="hud"><div class="stat"><small>星塵</small><strong id="gold">180</strong></div><div class="stat"><small>城門耐久</small><strong id="hp">20</strong></div><div class="stat"><small>波次</small><strong id="wave">0</strong></div><div class="stat"><small>擊破</small><strong id="kills">0</strong></div></div><canvas id="game" width="720" height="520"></canvas><div class="overlay" id="overlay"><div class="modal"><h2>星門失守</h2><p id="endText"></p><button class="btn" onclick="location.reload()">重新開始</button></div></div></section><aside class="side"><div class="card"><h2>⌁ 建造防禦塔</h2><button class="tower active" data-type="bolt"><span class="ico">⚡</span><span><b>電弧塔 · 60</b><small>快速射擊</small></span></button><button class="tower" data-type="cannon"><span class="ico">💥</span><span><b>星爆炮 · 95</b><small>範圍爆炸</small></span></button><button class="tower" data-type="frost"><span class="ico">❄️</span><span><b>寒霜塔 · 80</b><small>減速敵人</small></span></button><button class="tower" data-type="beam"><span class="ico">🔆</span><span><b>稜鏡塔 · 130</b><small>遠距高傷</small></span></button><div class="build-actions"><button class="confirm" id="confirmBuild" disabled>✓ 確定建設</button><button class="cancel" id="cancelBuild" disabled>取消選址</button></div><div class="message" id="message">選擇防禦塔，點亮固定建造點，再按「確定建設」。</div></div><div class="card"><h2>⚔ 戰場指揮</h2><button class="btn" id="start">▶ 開始第 1 波</button><button style="width:100%;margin-top:6px" id="speed">⏩ 二倍速：關</button><button style="width:100%;margin-top:6px" id="pause">Ⅱ 暫停</button><button style="width:100%;margin-top:6px" id="upgrade">⬆ 升級選中塔</button><p class="hint">點選防禦塔可查看射程並升級。每波守住後會獲得星塵獎勵。</p></div><div class="card"><h2>✧ 戰術提示</h2><div class="hint">• 敵人沿星路前進，抵達星門會扣除耐久。<br>• 防禦塔只能建在地圖固定建造點，選址後按「確定建設」。<br>• 敵人逐波變強，每四波會出現精英敵人。</div></div></aside></main>
<script>
(()=>{'use strict';const c=document.getElementById('game'),x=c.getContext('2d'),$=id=>document.getElementById(id),path=[[-25,100],[115,100],[115,220],[270,220],[270,90],[430,90],[430,340],[565,340],[565,455],[745,455]];
const types={bolt:{cost:60,range:125,rate:.52,damage:12,color:'#70e8ff',speed:360},cannon:{cost:95,range:112,rate:1.35,damage:34,color:'#ffad6b',speed:230,splash:54},frost:{cost:80,range:115,rate:.85,damage:5,color:'#a6d5ff',speed:290,slow:true},beam:{cost:130,range:180,rate:1.5,damage:58,color:'#f3d2ff',speed:600}};
const buildSpots=[[65,165],[185,155],[185,285],[330,285],[330,150],[485,150],[485,285],[620,285],[620,400],[675,395]];let pendingSpot=null;let gold=180,hp=20,wave=0,kills=0,towers=[],enemies=[],shots=[],parts=[],selected='bolt',sel=null,running=false,paused=false,fast=false,left=0,spawn=0,last=0,ended=false;const length=path.slice(1).reduce((s,p,i)=>s+Math.hypot(p[0]-path[i][0],p[1]-path[i][1]),0);
function at(d){for(let i=1;i<path.length;i++){let a=path[i-1],b=path[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d<=l){let t=d/l;return{x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t}}d-=l}return{x:745,y:455}}
function road(px,py){for(let d=0;d<length;d+=5){let p=at(d);if(Math.hypot(px-p.x,py-p.y)<31)return true}return false}function msg(t){$('message').textContent=t}function hud(){$('gold').textContent=gold;$('hp').textContent=hp;$('wave').textContent=wave;$('kills').textContent=kills;$('start').textContent=running?'波次進行中…':'▶ 開始第 '+(wave+1)+' 波';$('start').disabled=running||ended}
function clearPending(){pendingSpot=null;$('confirmBuild').disabled=true;$('cancelBuild').disabled=true}document.querySelectorAll('.tower').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.type;sel=null;clearPending();document.querySelectorAll('.tower').forEach(q=>q.classList.toggle('active',q===b));msg('已選擇'+b.querySelector('b').textContent+'，請點地圖上的固定建造點。')}));$('confirmBuild').onclick=()=>{if(!pendingSpot)return;let cost=types[selected].cost;if(gold<cost){msg('星塵不足！需要 '+cost+' 星塵。');return}gold-=cost;towers.push({x:pendingSpot[0],y:pendingSpot[1],type:selected,level:1,cool:0,angle:0});clearPending();msg('建造完成！防禦塔已部署。');hud()};$('cancelBuild').onclick=()=>{clearPending();msg('已取消選址。')};
c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),xx=(e.clientX-r.left)*720/r.width,yy=(e.clientY-r.top)*520/r.height;if(ended)return;let t=towers.find(t=>Math.hypot(t.x-xx,t.y-yy)<22);if(t){sel=t;clearPending();msg('已選中防禦塔，可升級。');return}sel=null;let spot=buildSpots.find(p=>Math.hypot(p[0]-xx,p[1]-yy)<23);if(!spot){msg('請點選地圖上的發光固定建造點。');return}if(towers.some(t=>Math.hypot(t.x-spot[0],t.y-spot[1])<10)){msg('這個建造點已被佔用。');return}pendingSpot=spot;$('confirmBuild').disabled=false;$('cancelBuild').disabled=false;msg('已選擇建造點（'+spot[0]+','+spot[1]+'），按「確定建設」完成建造。')});
$('upgrade').onclick=()=>{if(!sel){msg('先點選一座防禦塔。');return}let cost=sel.level*55;if(gold<cost){msg('升級需要 '+cost+' 星塵。');return}gold-=cost;sel.level=Math.min(5,sel.level+1);if(sel.level===3)msg('進化！Lv.3 進階形態：攻擊力提升並獲得專屬特性。');else if(sel.level===5)msg('究極進化！Lv.5 解鎖終極強化！');else msg('升級成功，攻擊更強！');hud()};$('start').onclick=()=>{if(running||ended)return;wave++;left=7+wave*3;spawn=.2;running=true;paused=false;$('pause').textContent='Ⅱ 暫停';msg('第 '+wave+' 波敵人來襲！');hud()};$('speed').onclick=()=>{fast=!fast;$('speed').textContent='⏩ 二倍速：'+(fast?'開':'關')};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ 繼續':'Ⅱ 暫停'};
function burst(px,py,col,n=7){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=20+Math.random()*90;parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.35,col})}}
function update(dt){dt*=fast?2:1;if(running){spawn-=dt;if(left>0&&spawn<=0){let elite=wave%4===0&&left===1;enemies.push({d:0,hp:elite?260:48+wave*14,max:elite?260:48+wave*14,speed:elite?27:37+wave*1.3,r:elite?15:10,elite,slow:0,dead:false});left--;spawn=Math.max(.32,.9-wave*.025)}
for(let e of enemies){if(e.dead)continue;e.d+=e.speed*dt*(e.slow>0?.5:1);e.slow=Math.max(0,e.slow-dt);if(e.d>=length){e.dead=true;hp-=e.elite?4:1;burst(690,455,'#ff6685');if(hp<=0){hp=0;ended=true;running=false;$('endText').textContent='你擊破 '+kills+' 名敵人，抵擋到第 '+wave+' 波。';$('overlay').classList.add('show')}}}enemies=enemies.filter(e=>!e.dead);
for(let t of towers){t.cool-=dt;if(t.cool>0)continue;let ty=types[t.type],range=ty.range+(t.level-1)*10,targets=enemies.filter(e=>Math.hypot(t.x-at(e.d).x,t.y-at(e.d).y)<range).sort((a,b)=>b.d-a.d);if(!targets.length)continue;let e=targets[0];t.angle=Math.atan2(at(e.d).y-t.y,at(e.d).x-t.x);shots.push({x:t.x,y:t.y,target:e,type:t.type,speed:ty.speed,damage:ty.damage*t.level*(t.level>=3?1.2:1)*(t.level>=5?1.25:1),color:ty.color,slow:ty.slow,splash:ty.splash});t.cool=ty.rate/Math.sqrt(t.level)}
for(let s of shots){if(!enemies.includes(s.target)){s.dead=true;continue}let p=at(s.target.d),dx=p.x-s.x,dy=p.y-s.y,l=Math.hypot(dx,dy),step=s.speed*dt;if(l<step+5){s.dead=true;if(s.splash){for(let e of enemies){let q=at(e.d);if(Math.hypot(q.x-p.x,q.y-p.y)<s.splash)e.hp-=s.damage}}else{s.target.hp-=s.damage;if(s.slow)s.target.slow=s.target.slow=Math.max(s.target.slow,s.target.level>=3?2.5:1.8)}burst(p.x,p.y,s.color,3)}else{s.x+=dx/l*step;s.y+=dy/l*step}}shots=shots.filter(s=>!s.dead);
for(let e of enemies){if(e.hp<=0&&!e.dead){e.dead=true;kills++;gold+=e.elite?35:12;let p=at(e.d);burst(p.x,p.y,'#ffd36b',8)}}enemies=enemies.filter(e=>!e.dead);for(let p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}parts=parts.filter(p=>p.life>0);if(left===0&&enemies.length===0){running=false;gold+=30+wave*5;msg('第 '+wave+' 波守住了！獲得 '+(30+wave*5)+' 星塵。')}hud()}}
function draw(){x.clearRect(0,0,720,520);let g=x.createLinearGradient(0,0,720,520);g.addColorStop(0,'#102541');g.addColorStop(1,'#071326');x.fillStyle=g;x.fillRect(0,0,720,520);x.strokeStyle='#1b304b';x.lineWidth=1;for(let xx=0;xx<720;xx+=30){x.beginPath();x.moveTo(xx,0);x.lineTo(xx,520);x.stroke()}for(let yy=0;yy<520;yy+=30){x.beginPath();x.moveTo(0,yy);x.lineTo(720,yy);x.stroke()}
x.lineCap='round';x.lineJoin='round';x.strokeStyle='#14283f';x.lineWidth=58;x.beginPath();path.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();x.strokeStyle='#294763';x.lineWidth=46;x.stroke();x.setLineDash([8,12]);x.strokeStyle='#8294a8';x.lineWidth=2;x.beginPath();path.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();x.setLineDash([]);x.fillStyle='#5ce4ff';x.shadowColor='#5ce4ff';x.shadowBlur=18;x.beginPath();x.arc(680,455,18,0,6.28);x.fill();x.shadowBlur=0;x.fillStyle='#eefaff';x.font='bold 12px system-ui';x.fillText('星門',650,425);
for(let p of buildSpots){let occupied=towers.some(t=>Math.hypot(t.x-p[0],t.y-p[1])<8);x.save();x.globalAlpha=occupied?.25:(pendingSpot===p?1:.72);x.fillStyle=occupied?'#5b6d83':(pendingSpot===p?'#fff0a0':'#6be6ff');x.strokeStyle=x.fillStyle;x.lineWidth=2;x.beginPath();x.arc(p[0],p[1],pendingSpot===p?15:11,0,6.28);x.fill();x.stroke();x.fillStyle='#081222';x.font='bold 12px system-ui';x.textAlign='center';x.fillText(occupied?'✓':'+',p[0],p[1]+4);x.restore()}for(let t of towers){let ty=types[t.type];x.save();x.translate(t.x,t.y);x.fillStyle='#081222';x.strokeStyle=ty.color;x.lineWidth=2;x.beginPath();x.arc(0,0,17,0,6.28);x.fill();x.stroke();x.rotate(t.angle);x.fillStyle=ty.color;x.fillRect(0,-4,21,8);x.restore();x.fillStyle='#eef5ff';x.textAlign='center';x.font='10px system-ui';x.fillText('Lv.'+t.level,t.x,t.y+30);if(t===sel){x.strokeStyle='#fff0a0';x.setLineDash([4,4]);x.beginPath();x.arc(t.x,t.y,ty.range+(t.level-1)*10,0,6.28);x.stroke();x.setLineDash([])}}
for(let e of enemies){let p=at(e.d);x.fillStyle=e.elite?'#ff5d9c':'#ff7b83';x.shadowColor=x.fillStyle;x.shadowBlur=10;x.beginPath();x.arc(p.x,p.y,e.r,0,6.28);x.fill();x.shadowBlur=0;x.fillStyle='#301827';x.fillRect(p.x-13,p.y-e.r-9,26,4);x.fillStyle='#72f0a8';x.fillRect(p.x-13,p.y-e.r-9,26*Math.max(0,e.hp/e.max),4)}for(let s of shots){let p=at(s.target.d);x.strokeStyle=s.color;x.lineWidth=s.type==='beam'?4:2;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x+(p.x-s.x)*.25,s.y+(p.y-s.y)*.25);x.stroke()}for(let p of parts){x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.col;x.fillRect(p.x,p.y,3,3)}x.globalAlpha=1;if(!wave&&!running){x.fillStyle='#d7e6fa';x.textAlign='center';x.font='bold 15px system-ui';x.fillText('選擇防禦塔，點空地建造，再開始波次',360,490)}}
function frame(ts){let dt=Math.min(.04,(ts-last)/1000||0);last=ts;if(!paused)update(dt);draw();requestAnimationFrame(frame)}hud();requestAnimationFrame(frame)})();
</script></body></html>
