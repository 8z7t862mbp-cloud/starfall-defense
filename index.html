<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#08111d"><title>星圖守城｜Starfall Defense</title>
<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06111c;color:#f8f2df;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior-y:auto;-webkit-overflow-scrolling:touch}body{background:radial-gradient(ellipse at 50% 0,#254b4a 0,#0a1c27 42%,#030912 100%);padding-bottom:18px}

.brand{display:flex;align-items:center;gap:9px;min-width:0}.crest{width:48px;height:48px;flex:none;border:2px solid #d7b568;border-radius:50%;display:grid;place-items:center;color:#f9e5a6;font-size:30px;text-shadow:0 0 15px #53dfff;box-shadow:inset 0 0 12px #43cfff55,0 0 12px #d9ae5555}.brand h1{font-size:clamp(19px,4vw,30px);margin:0;color:#ffe09a;letter-spacing:.05em;line-height:1.05;text-shadow:0 2px 12px #ffc85c55}.brand small{display:block;color:#b7c8d3;font-size:10px;letter-spacing:.15em;margin-top:4px}.top-actions{display:flex;gap:6px}.metal-btn{border:1px solid #c39c56;border-radius:9px;background:linear-gradient(#26384a,#0a1421);color:#ffe4a2;font-weight:800;font-size:15px;min-width:42px;padding:9px;box-shadow:inset 0 0 0 1px #ffffff10,0 3px 0 #03070b}
main{max-width:1120px;margin:auto;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:10px}.stage{border:1px solid #b49355;border-radius:15px;overflow:hidden;background:#071522;box-shadow:0 15px 35px #0009,inset 0 0 0 2px #fff1}.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:8px;background:linear-gradient(90deg,#07101c,#1b2e42,#07101c);border-bottom:1px solid #a7834c}.stat{border:1px solid #806e51;border-radius:9px;background:linear-gradient(180deg,#263d52,#0a1727);padding:6px 4px;text-align:center;box-shadow:inset 0 0 0 1px #fff1}.stat span{display:block;font-size:11px;color:#bdcbd7;white-space:nowrap}.stat b{font-size:clamp(17px,3vw,23px);color:#ffe4a2;line-height:1.25}.stat.hp b{color:#ff9d9d}.stat.wave b{color:#ffce7b}.stat.kills b{color:#8cebdc}

.side{display:flex;flex-direction:column;gap:10px}.panel{border:1px solid #806b49;border-radius:14px;padding:10px;background:linear-gradient(145deg,#172c3e,#07111e 80%);box-shadow:0 10px 25px #0006,inset 0 0 0 1px #ffffff0a}.panel h2{font-size:17px;color:#f5d17a;margin:0 0 9px;letter-spacing:.05em}.tower-list{display:grid;gap:7px}.tower-card{width:100%;display:grid;grid-template-columns:62px 1fr;align-items:center;gap:9px;text-align:left;padding:7px;border:1px solid #3e5a72;border-radius:10px;background:linear-gradient(130deg,#1c344c,#0b1928);color:#f7f4e9;min-height:83px}.tower-card.selected{border:2px solid #65edff;box-shadow:0 0 18px #34dfff55,inset 0 0 0 1px #ffffff26;background:linear-gradient(130deg,#164568,#0b2034)}.tower-art{width:60px;height:64px;border-radius:8px;display:grid;place-items:center;font-size:36px;background:radial-gradient(circle at 50% 45%,#315c7d,#07121f 72%);border:1px solid #b89b5b;position:relative;text-shadow:0 0 14px currentColor}.tower-art:after{content:"";position:absolute;bottom:5px;width:42px;height:8px;border-radius:50%;border:2px solid #5edff9;box-shadow:0 0 9px #4bdfff}.tower-card strong{font-size:14px;display:block}.tower-card small{display:block;color:#a9c0d0;font-size:12px;margin-top:3px}.cost{color:#7ce9ff!important;font-weight:800}.hint{font-size:12px;color:#a8bfcd;line-height:1.55;margin:9px 2px 0}.tool-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tool-row button{font-size:12px}.log{min-height:38px;font-size:12px;line-height:1.5;color:#d2e7ed;background:#06111d;border:1px solid #294458;border-radius:8px;padding:8px}.footnote{text-align:center;color:#7695a8;font-size:10px;padding:10px}
dialog{max-width:340px;width:calc(100% - 30px);border:1px solid #b9995e;border-radius:14px;background:#0c1b2a;color:#fff1d0;box-shadow:0 20px 80px #000c}dialog::backdrop{background:#000a;backdrop-filter:blur(4px)}dialog h2{margin-top:0;color:#f8d581}dialog button{margin-top:12px}
@media(max-width:760px){main{display:flex;flex-direction:column;padding:7px;gap:8px}.side{display:flex;flex-direction:column}.tower-list{grid-template-columns:repeat(2,minmax(0,1fr))}.tower-card{grid-template-columns:48px 1fr;min-height:72px;padding:6px;gap:6px}.tower-art{width:46px;height:50px;font-size:29px}.tower-art:after{width:31px}.panel{padding:9px}.panel h2{font-size:16px}.hud{padding:6px}.stat span{font-size:9px}.stat b{font-size:clamp(14px,3.6vw,19px)}.game-controls{padding:6px}.action{padding:10px 4px;font-size:12px}.brand small{font-size:8px}.crest{width:39px;height:39px;font-size:25px}}
</style></head><body>
<header><div class="brand"><div class="crest">✧</div><div><h1>星圖守城</h1><small>STARFALL DEFENSE · GUARD THE STAR GATE</small></div></div><div class="top-actions"><button class="metal-btn" id="speedBtn" aria-label="切換速度">×1</button><button class="metal-btn" id="pauseBtn" aria-label="暫停">Ⅱ</button></div></header>
<main><section class="stage"><div class="hud"><div class="stat"><span>💎 星塵</span><b id="gold">240</b></div><div class="stat hp"><span>❤️ 城門耐久</span><b id="hp">20/20</b></div><div class="stat wave"><span>☠ 波次</span><b id="wave">0/20</b></div><div class="stat kills"><span>⚔ 擊退</span><b id="kills">0</b></div></div><canvas id="battle" width="720" height="1000" aria-label="星圖守城戰場"></canvas><div class="game-controls"><button class="action" id="saveBtn">▣ 儲存</button><button class="action" id="loadBtn">↻ 讀取</button><button class="action primary" id="startBtn">▶ 開始波次</button></div></section>
<aside class="side"><section class="panel"><h2>✦ 建造防禦塔</h2><div class="tower-list" id="towerList"></div><p class="hint" id="hint">選擇塔型，再點戰場上的發光石座；按「確定建造」完成建塔。</p><div class="tool-row" style="margin-top:8px"><button class="action primary" id="confirmBtn" disabled>✓ 確定建造</button><button class="action" id="cancelBtn">取消選址</button></div></section><section class="panel"><h2>⚒ 戰術指令</h2><div class="tool-row"><button class="action" id="upgradeBtn">⬆ 升級選中塔</button><button class="action" id="sellBtn">↗ 拆除回收</button><button class="action" id="settingsBtn">⚙ 設定</button><button class="action" id="resetBtn">⟲ 新遊戲</button></div><p class="hint">Lv.3 解鎖高階形態，Lv.5 解鎖終極形態。點已建造的塔可查看與升級。</p></section><section class="panel"><h2>✧ 戰場訊息</h2><div class="log" id="log">星門已啟動。配置防禦塔，準備迎戰侵蝕者。</div></section></aside></main><div class="footnote">STARFALL DEFENSE · 守住星門，迎接黎明</div>
<dialog id="settings"><h2>星門設定</h2><label><input type="checkbox" id="fxToggle" checked> 開啟魔法特效</label><br><label><input type="checkbox" id="shakeToggle" checked> 開啟受擊震動</label><p class="hint">進度會儲存在此裝置的瀏覽器中。</p><button class="action primary" id="closeSettings">完成</button></dialog>
<script>
(function(){
'use strict';
const c=document.getElementById('battle'),x=c.getContext('2d');
const $=id=>document.getElementById(id);
const W=720,H=1000;
const towerTypes=[
 {id:'arc',name:'電弧塔',icon:'⚡',cost:60,desc:'快速連鎖射擊',color:'#58eaff',range:155,damage:18,rate:.62},
 {id:'bomb',name:'星爆炮',icon:'💥',cost:95,desc:'範圍爆炸傷害',color:'#ff9b4a',range:170,damage:42,rate:1.55},
 {id:'frost',name:'寒霜塔',icon:'❄️',cost:80,desc:'冰凍減速敵人',color:'#9eeaff',range:145,damage:10,rate:.9},
 {id:'prism',name:'稜鏡塔',icon:'🔆',cost:130,desc:'遠距高能光束',color:'#ffd778',range:230,damage:58,rate:1.25}
];
const path=[[-22,115],[128,115],[153,238],[292,238],[315,118],[462,118],[483,328],[365,378],[358,522],[510,560],[548,710],[405,755],[425,884],[672,925]];
const pads=[{x:74,y:177},{x:194,y:279},{x:254,y:171},{x:370,y:184},{x:420,y:278},{x:540,y:356},{x:298,y:294},{x:292,y:434},{x:430,y:488},{x:580,y:548},{x:600,y:704},{x:480,y:790},{x:350,y:850},{x:505,y:900}];
let gold=240,hp=20,wave=0,kills=0,towers=[],enemies=[],shots=[],fx=[],selectedType='arc',pending=null,selectedTower=null,paused=false,speed=1,spawnLeft=0,spawnClock=0,between=0,last=0,gameOver=false,fxOn=true,shakeOn=true,shake=0,serial=0;
const saveKey='starfall-defense-remake-v3';
const rand=(a,b)=>a+Math.random()*(b-a);
function say(t){$('log').textContent=t}
function hud(){ $('gold').textContent=gold;$('hp').textContent=hp+'/20';$('wave').textContent=wave+'/20';$('kills').textContent=kills;$('startBtn').textContent=gameOver?'⟲ 重新開始':'▶ '+(spawnLeft||enemies.length?'戰鬥進行中':'開始波次');$('startBtn').disabled=!gameOver&&(spawnLeft>0||enemies.length>0);$('confirmBtn').disabled=!pending; }
function renderCards(){const box=$('towerList');box.innerHTML='';towerTypes.forEach(t=>{const b=document.createElement('button');b.className='tower-card'+(selectedType===t.id?' selected':'');b.innerHTML='<span class="tower-art" style="color:'+t.color+'">'+t.icon+'</span><span><strong>'+t.name+'</strong><small class="cost">💎 '+t.cost+'</small><small>'+t.desc+'</small></span>';b.onclick=()=>{selectedType=t.id;pending=null;selectedTower=null;renderCards();$('confirmBtn').disabled=true;say('已選擇'+t.name+'，請點擊戰場上的空石座。');};box.appendChild(b);});}
function pathPoint(t){let remain=t;for(let i=1;i<path.length;i++){let a=path[i-1],b=path[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]);if(remain<=d){return{x:a[0]+(b[0]-a[0])*remain/d,y:a[1]+(b[1]-a[1])*remain/d,angle:Math.atan2(b[1]-a[1],b[0]-a[0])};}remain-=d;}return{x:path[path.length-1][0],y:path[path.length-1][1],angle:0};}
const pathLength=path.slice(1).reduce((s,p,i)=>s+Math.hypot(p[0]-path[i][0],p[1]-path[i][1]),0);
function newWave(){if(gameOver){reset();return;}if(spawnLeft>0||enemies.length)return;if(wave>=20){say('星門守住了！二十波侵蝕者已全數擊退。');return;}wave++;spawnLeft=6+wave*2;spawnClock=.35;between=0;say('第 '+wave+' 波來襲！將逐步加入重甲兵、迅捷者與每五波首領。擊殺可獲得星塵。');hud();}
function reset(){gold=240;hp=20;wave=0;kills=0;towers=[];enemies=[];shots=[];fx=[];spawnLeft=0;paused=false;gameOver=false;pending=null;selectedTower=null;hud();say('新的遠征開始。選擇防禦塔並部署在石座上。');}
function save(){const d={gold,hp,wave,kills,towers:towers.map(t=>({pad:t.pad,type:t.type,level:t.level})),savedAt:Date.now()};localStorage.setItem(saveKey,JSON.stringify(d));say('進度已儲存，可隨時讀取。');}
function load(){try{const d=JSON.parse(localStorage.getItem(saveKey)||'null');if(!d)throw Error();gold=d.gold;hp=d.hp;wave=d.wave;kills=d.kills||0;towers=(d.towers||[]).map(t=>({...pads[t.pad],pad:t.pad,type:t.type,level:t.level,cool:0,angle:0})).filter(t=>towerTypes.some(a=>a.id===t.type));enemies=[];shots=[];fx=[];spawnLeft=0;gameOver=hp<=0;pending=null;selectedTower=null;hud();say('已讀取儲存進度。');}catch(e){say('目前沒有可讀取的存檔。');}}
function build(){if(pending==null)return;const t=towerTypes.find(a=>a.id===selectedType),p=pads[pending];if(towers.some(a=>a.pad===pending)){say('這個石座已有防禦塔。');return;}if(gold<t.cost){say('星塵不足，需要 '+t.cost+'。');return;}gold-=t.cost;towers.push({x:p.x,y:p.y,pad:pending,type:t.id,level:1,cool:rand(0,.4),angle:-Math.PI/2});pending=null;selectedTower=null;hud();say(t.name+'已建造！敵軍進入射程後會自動攻擊。');}
function upgrade(){if(!selectedTower){say('請先點選戰場上的防禦塔。');return;}const t=selectedTower,cost=selectedTower.level*55;if(t.level>=5){say('已達 Lv.5 終極形態。');return;}if(gold<cost){say('星塵不足，升級需要 '+cost+'。');return;}gold-=cost;t.level++;const d=towerTypes.find(a=>a.id===t.type);burst(t.x,t.y,d.color,22);say(d.name+'升至 Lv.'+t.level+(t.level===3?' · 高階進化！':t.level===5?' · 終極進化！':'')+'，攻擊能力提升。');hud();}
function sell(){if(!selectedTower){say('請先選取一座已建造的塔。');return;}gold+=Math.floor(towerTypes.find(a=>a.id===selectedTower.type).cost*.55);towers=towers.filter(t=>t!==selectedTower);selectedTower=null;hud();say('防禦塔已拆除，回收部分星塵。');}
function burst(x0,y0,color,n){if(!fxOn)return;for(let i=0;i<n;i++)fx.push({x:x0,y:y0,vx:rand(-95,95),vy:rand(-105,45),life:rand(.25,.75),max:.75,color,r:rand(1.5,4)});}
function spawnEnemy(){const boss=wave%5===0&&spawnLeft===1;const kind=boss?'boss':wave>=4&&Math.random()<.24?'runner':wave>=3&&Math.random()<.22?'tank':'grunt';const base=boss?420:kind==='tank'?145:kind==='runner'?38:65;const hp0=base*(1+Math.max(0,wave-1)*.12);enemies.push({id:++serial,kind,dist:0,hp:hp0,max:hp0,speed:boss?24:kind==='runner'?68+wave*.7:kind==='tank'?25+wave*.25:rand(34,43)+wave*.45,r:boss?21:kind==='tank'?16:kind==='runner'?9:12,boss,slow:0,hit:0});spawnLeft--;if(boss)say('⚠ 首領侵蝕者突破前線！');}
function update(dt){dt*=speed;if(spawnLeft>0){spawnClock-=dt;if(spawnClock<=0){spawnEnemy();spawnClock=Math.max(.32,.86-wave*.018);}}if(spawnLeft===0&&enemies.length===0&&wave>0&&wave<20&&!gameOver){between+=dt;if(between>1.8){say('第 '+wave+' 波已清除。準備下一波。');between=-999;}}
 for(const e of enemies){e.hit=Math.max(0,e.hit-dt);e.slow=Math.max(0,e.slow-dt);e.dist+=(e.slow>0?e.speed*.48:e.speed)*dt;const p=pathPoint(e.dist);e.x=p.x;e.y=p.y;if(e.dist>=pathLength){e.dead=true;hp=Math.max(0,hp-(e.boss?4:1));shake=shakeOn?.28:0;burst(660,925,'#ff6b66',12);if(hp<=0){gameOver=true;paused=true;say('星門被突破！點擊「新遊戲」重新守衛。');}}}
 for(const t of towers){t.cool-=dt;const spec=towerTypes.find(a=>a.id===t.type);let target=null,best=1e9;for(const e of enemies){if(e.dead)continue;const d=Math.hypot(e.x-t.x,e.y-t.y);if(d<spec.range+(t.level-1)*10&&e.dist<best){best=e.dist;target=e;}}if(target&&t.cool<=0){t.angle=Math.atan2(target.y-t.y,target.x-t.x);t.cool=spec.rate*Math.max(.48,1-(t.level-1)*.1);shots.push({x:t.x,y:t.y-18,tx:target.x,ty:target.y,enemy:target,life:.22,color:spec.color,damage:spec.damage*(1+(t.level-1)*.52),type:t.type,level:t.level});if(fxOn)fx.push({x:t.x,y:t.y-18,vx:rand(-18,18),vy:-20,life:.16,max:.16,color:spec.color,r:7});}}
 for(const s of shots){s.life-=dt;if(s.life<=0&&!s.done){s.done=true;const e=s.enemy;if(e&&!e.dead){if(s.type==='bomb'){for(const other of enemies){if(!other.dead&&Math.hypot(other.x-e.x,other.y-e.y)<62){other.hp-=s.damage*(other===e?1:.55);if(other.hp<=0)kill(other);}}burst(e.x,e.y,s.color,18);}else{e.hp-=s.damage;if(s.type==='frost')e.slow=1.6;burst(e.x,e.y,s.color,s.type==='prism'?9:5);if(e.hp<=0)kill(e);}}}}
 shots=shots.filter(s=>s.life>0);enemies=enemies.filter(e=>!e.dead);fx=fx.filter(p=>p.life>0);for(const p of fx){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt;}shake=Math.max(0,shake-dt);hud();}
function kill(e){if(e.dead)return;e.dead=true;kills++;gold+=e.boss?55:12;burst(e.x,e.y,e.boss?'#ffd078':'#a3f5ff',e.boss?30:12);}
function rounded(ctx,x0,y0,w,h,r){ctx.beginPath();ctx.roundRect(x0,y0,w,h,r);}
function poly(points,fill,stroke,lw=1){x.beginPath();points.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.stroke();}}
function glow(x0,y0,r,color,alpha=1){const g=x.createRadialGradient(x0,y0,0,x0,y0,r);g.addColorStop(0,color);g.addColorStop(1,'#00000000');x.globalAlpha=alpha;x.fillStyle=g;x.beginPath();x.arc(x0,y0,r,0,Math.PI*2);x.fill();x.globalAlpha=1;}
function drawTree(px,py,s,phase){x.save();x.translate(px,py);x.rotate(Math.sin(performance.now()*.0013+phase)*.035);x.scale(s,s);x.fillStyle='#061b1b';x.beginPath();x.ellipse(0,4,19,8,0,0,7);x.fill();x.fillStyle='#60432b';x.fillRect(-3,-23,6,26);for(let i=0;i<4;i++){const yy=-16-i*12;poly([[-17,yy+7],[0,yy-15],[17,yy+7],[8,yy+5],[0,yy+11],[-8,yy+5]],i%2?'#174b3a':'#226747','#78b68a',.8);}x.restore();}
function drawBackground(){
 const tm=performance.now()*.001;const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#345f51');g.addColorStop(.38,'#104039');g.addColorStop(1,'#061a25');x.fillStyle=g;x.fillRect(0,0,W,H);
 poly([[0,180],[65,77],[135,145],[218,40],[296,142],[375,50],[452,138],[530,37],[614,133],[720,58],[720,0],[0,0]],'#456c5c','#94b49a66',2);poly([[0,270],[82,185],[155,253],[252,155],[335,257],[435,169],[528,254],[622,162],[720,241],[720,0],[0,0]],'#1b483d');

function draw(){x.save();if(shake>0&&shakeOn)x.translate(rand(-3,3),rand(-3,3));drawBackground();drawPath();drawGate();drawPads();towers.forEach(drawTower);enemies.forEach(drawEnemy);drawShots();for(const p of fx){x.globalAlpha=Math.max(0,p.life/p.max);glow(p.x,p.y,p.r*3,p.color,.7);x.fillStyle=p.color;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();}x.globalAlpha=1;
 // entrance/exit markers and battlefield title rune
 glow(672,925,54,'#35eaff',.55);x.strokeStyle='#9cf8ff';x.lineWidth=4;x.beginPath();x.arc(672,925,31,0,Math.PI*2);x.stroke();x.fillStyle='#e3ffff';x.beginPath();x.arc(672,925,16,0,Math.PI*2);x.fill();x.fillStyle='#e6d7a8';x.font='bold 13px system-ui';x.textAlign='center';x.fillText('守護星門',672,973);
 if(paused&&!gameOver){x.fillStyle='#030914aa';x.fillRect(0,0,W,H);x.fillStyle='#ffe4a0';x.font='bold 42px system-ui';x.fillText('戰場暫停',W/2,H/2);x.font='18px system-ui';x.fillText('點擊右上角繼續',W/2,H/2+35);}if(gameOver){x.fillStyle='#030914c9';x.fillRect(0,0,W,H);x.fillStyle='#ffe1a0';x.font='bold 38px system-ui';x.fillText(hp<=0?'星門失守':'守城成功',W/2,H/2);x.font='18px system-ui';x.fillText('請按「新遊戲」重新出征',W/2,H/2+36);}x.restore();}
function hitCanvas(ev){const r=c.getBoundingClientRect(),px=(ev.clientX-r.left)*W/r.width,py=(ev.clientY-r.top)*H/r.height;if(gameOver)return;let nearest=null,nd=1e9;for(const t of towers){const d=Math.hypot(t.x-px,t.y-py);if(d<46&&d<nd){nearest=t;nd=d;}}if(nearest){selectedTower=nearest;pending=null;renderCards();say(towerTypes.find(a=>a.id===nearest.type).name+' Lv.'+nearest.level+' · 升級費用 '+(nearest.level*55)+' 星塵');return;}let best=-1,bd=1e9;pads.forEach((p,i)=>{const d=Math.hypot(p.x-px,p.y-py);if(d<43&&d<bd){best=i;bd=d;}});if(best>=0){if(towers.some(t=>t.pad===best)){say('此石座已有防禦塔，點擊塔體可選取。');return;}pending=best;selectedTower=null;$('confirmBtn').disabled=false;say('已選定石座。確認建造後才會扣除星塵。');}}
c.addEventListener('click',hitCanvas);$('confirmBtn').onclick=build;$('cancelBtn').onclick=()=>{pending=null;$('confirmBtn').disabled=true;say('已取消選址。');};$('upgradeBtn').onclick=upgrade;$('sellBtn').onclick=sell;$('startBtn').onclick=newWave;$('saveBtn').onclick=save;$('loadBtn').onclick=load;$('resetBtn').onclick=()=>{if(confirm('確定開始新遊戲？目前未儲存的進度將消失。'))reset();};$('speedBtn').onclick=()=>{speed=speed===1?2:1;$('speedBtn').textContent='×'+speed;say('戰鬥速度已切換為 '+speed+' 倍。');};$('pauseBtn').onclick=()=>{paused=!paused;$('pauseBtn').textContent=paused?'▶':'Ⅱ';say(paused?'戰場已暫停。':'戰鬥繼續。');};$('settingsBtn').onclick=()=>$('settings').showModal();$('closeSettings').onclick=()=>$('settings').close();$('fxToggle').onchange=e=>fxOn=e.target.checked;$('shakeToggle').onchange=e=>shakeOn=e.target.checked;
function loop(ts){let dt=Math.min(.045,(ts-last)/1000||0);last=ts;if(!paused&&!gameOver)update(dt);draw();requestAnimationFrame(loop);}
renderCards();hud();requestAnimationFrame(loop);
})();
